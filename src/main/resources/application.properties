spring.application.name=entrevistia-api
spring.profiles.active=dev

# Las tablas se crean con db/schema.sql; JPA solo valida que coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Asistente con Gemini. La llave va en application-dev.properties o en la
# variable de entorno GEMINI_API_KEY; nunca en este archivo.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}

# Revisor de CV: PDF de máximo 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
