# Producción (Render + Supabase). NO lleva secretos: todo se lee de
# variables de entorno que se configuran en el panel de Render.
server.port=${PORT:8080}

# PostgreSQL de Supabase (Session pooler). Ej. de DB_URL:
# jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# El pooler gratuito admite pocas conexiones
spring.datasource.hikari.maximum-pool-size=3

gemini.api-key=${GEMINI_API_KEY:}
firebase.project-id=${FIREBASE_PROJECT_ID}
